[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swipeflow-api"
version = "1.1.4"
description = "Python SDK for SwipeFlow API - Add manual approval steps to your workflows with an efficient card-based swipe interface"
readme = "README.md"
license = {text = "ISC"}
authors = [
    {name = "SwipeFlow", email = "support@swipeflow.io"}
]
keywords = ["swipeflow", "api", "sdk", "automation", "approval", "workflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: ISC License (ISCL)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.23.1,<0.29.0",
    "attrs>=22.2.0",
]

[project.optional-dependencies]
dev = [
    "openapi-python-client>=0.29.1,<0.30",
    "pytest>=7.0.0",
    "build>=0.10.0",
]

[project.urls]
Homepage = "https://swipeflow.io"
Documentation = "https://swipeflow.io/docs"
Repository = "https://github.com/swipeflow/swipeflow-api-py"
"Issue Tracker" = "https://github.com/swipeflow/swipeflow-api-py/issues"

[tool.setuptools.packages.find]
include = ["swipeflow_api*"]

[tool.setuptools.package-data]
swipeflow_api = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
